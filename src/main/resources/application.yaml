server:
  port: ${PORT:8080}

spring:
  application:
    name: Fitness

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-days: 7

security:
  login-rate-limit:
    max-attempts-per-login-ip: 5
    max-attempts-per-ip: 30
    window: 15m
    max-registration-attempts-per-ip: 10
    registration-window: 1h
    max-failed-password-changes-per-user-ip: 5
    password-change-window: 15m

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
